name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Unit tests, negative controls, and workspace checks
        run: make check PYTHON=python
      - name: Check installed command
        run: countertrace --version

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Type-check and build the web interface
        working-directory: apps/web
        run: npm ci && npm test && npm run build

  verifier:
    # Builds the pinned verifier image (downloads the OSS CAD Suite release and
    # checks its SHA-256) and runs real RTL inside it.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Build verifier image
        run: PYTHONPATH=src python -m countertrace build-image
      - name: Integration tests in the isolated verifier
        run: make test-integration PYTHON=python

  clean-replay:
    # Clean-environment reproducibility: each leg starts from a fresh runner,
    # builds the pinned image from scratch, exports three recorded bundles, and
    # replays their deterministic checks without any model call.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        replay: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Build verifier image
        run: PYTHONPATH=src python -m countertrace build-image
      - name: Export and replay recorded bundles
        shell: bash
        run: |
          set -euo pipefail
          for id in rec-20261004-003607-ver-4cc749 rec-20261001-193044-ver-f15d50 rec-20261004-003622-ver-d88ef8; do
            bundle=$(PYTHONPATH=src python -m countertrace bundle "$id")
            PYTHONPATH=src python -m countertrace replay "$bundle" | tee "replay-$id.json"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: clean-replay-${{ matrix.replay }}
          path: replay-*.json
