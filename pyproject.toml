[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "countertrace"
version = "0.0.1"
description = "A FIFO verification workbench for FPGA learners"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Repository = "https://github.com/Jeremiah-Sakuda/countertrace"
Issues = "https://github.com/Jeremiah-Sakuda/countertrace/issues"

[project.scripts]
countertrace = "countertrace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
